$kind: http-request
name: Semua data-plans
url: "{{base_url}}/data-plans"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Status code adalah 200', function () {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test('Response berupa array', function () {\r

      \  const jsonData = pm.response.json();\r

      \  pm.expect(jsonData).to.be.an('array');\r

      });\r

      \r

      pm.test('Setiap data memiliki id dan namaPaket', function () {\r

      \  const jsonData = pm.response.json();\r

      \  jsonData.forEach((item) => {\r

      \    pm.expect(item).to.have.property('id');\r

      \    pm.expect(item).to.have.property('namaPaket');\r

      \  });\r

      });\r

      \r

      pm.test('Response time di bawah 500ms', function () {\r

      \  pm.expect(pm.response.responseTime).to.be.below(500);\r

      }); \r

      \r

      pm.test('Data namaPaket pertama bernama \"Internet Bulanan 25GB\"',
      function () {\r

      \  const jsonData = pm.response.json();\r

      \  pm.expect(jsonData[0].namaPaket).to.eql('Internet Bulanan 25GB');\r

      });\r\n"
    language: text/javascript
order: 1791
