$kind: http-request
url: "{{base_url}}/data-plans/{{dataplansId}}"
method: PUT
headers:
  x-api-key: "{{api_key}}"
body:
  type: json
  content: '{ "operator": "Telkomsel" }'
scripts:
  - type: afterResponse
    code: "pm.test('Status code adalah 200', function () {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test('Jurusan berubah, nama tetap', function () {\r

      \  const jsonData = pm.response.json();\r

      \  pm.expect(jsonData.operator).to.eql('Telkomsel');\r

      \  pm.expect(jsonData.namaPaket).to.eql('Internet Bulanan 50GB');\r

      });"
    language: text/javascript
order: 6047
