$kind: http-request
url: "{{base_url}}/data-plans"
method: POST
headers:
  x-api-key: "{{api_key}}"
body:
  type: json
  content: '{ "namaPaket": "Internet Harian 5GB" }'
scripts:
  - type: afterResponse
    code: "pm.test('Status code adalah 400', function () {\r

      \  pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test('Pesan error menyebut field wajib', function () {\r

      \  pm.expect(pm.response.json().message).to.include('wajib diisi');\r

      });"
    language: text/javascript
order: 5000
